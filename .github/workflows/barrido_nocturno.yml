name: Barrido Nocturno Inventario

on:
  schedule:
    # Se ejecuta a las 2:00 AM CDMX (8:00 AM UTC) sábados y domingos
    - cron: '0 8 * * 6,0'
  workflow_dispatch: # Permite que lo arranques manualmente con un botón en GitHub

jobs:
  actualizar_inventario:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pandas

      - name: Ejecutar Expedite Nocturno
        run: python expedite_fin_de_semana.py

      - name: Guardar Base de Datos Actualizada
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zapateria_vallejo.db || true
          git add data/zapateria_vallejo.db || true
          git commit -m "🤖 Actualización automática de inventario nocturno" || exit 0
          git push