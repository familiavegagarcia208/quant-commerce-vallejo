name: Quant-Commerce Vallejo Pipeline ETL

on:
  schedule:
    # Ejecuta un lote de 20 SKUs cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: vallejo-etl-master-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias y motor React (Playwright)
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install curl_cffi pandas streamlit playwright
          playwright install --with-deps chromium

      - name: Fase 1, 2 y 3A - Motor ETL (Tokens React + Curva Decay + SQLite)
        run: python motor_etl_vallejo.py

      - name: Fase 3B - Sincronizador y Baja Automatica Mercado Libre
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
        run: python paso7_sincronizador_ml.py

      - name: Consolidar WAL y Respaldar Estado en GitHub
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/zapateria_vallejo.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE);'); c.close()"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zapateria_vallejo.db data/cola_sincronizacion_ml.json simulacion_bulk_ml.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-ETL: Serie de Tiempo + Curva Decay + Bayesiano UCB"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sin cambios pendientes por sincronizar."
          fi
