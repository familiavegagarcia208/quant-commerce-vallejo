name: Motor Quant-Commerce Vallejo (41 Tiendas + Verdes)

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditar-inventario-vallejo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Descargar repositorio actualizado
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependencias y navegador Chromium actualizado
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright curl_cffi pandas numpy pillow
          playwright install --with-deps chromium

      - name: 4. Ejecutar Paso 3 (Recolector Multi-Tienda 41 Sucursales)
        env:
          LOTE_MICRO_SESION: "140"
        run: |
          python paso3_recolector_ligero.py

      - name: 5. Ejecutar Paso 6 y Paso 5 (Laminas HD Verdes + Motor Financiero)
        env:
          MAX_FOTOS_CORRIDA: "80"
          MAX_HILOS_FOTOS: "10"
        run: |
          python paso6_estudio_fotografico.py
          python paso5_motor_financiero.py

      - name: 6. Guardar Base de Datos y Laminas HD en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/zapateria_vallejo.db data/catalogo_listo/
          git diff --staged --quiet || git commit -m "Auto-Sync 41 Tiendas, Carruseles HD y Motor Financiero [skip ci]"
          git push origin main